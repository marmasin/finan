# Tema po uzoru na PowerToys postavke (Windows 11 / Fluent, tamna) — vidi
# stil.py, gdje su isti tokeni na jednom mjestu.
#
# Namjerno je `base = "dark"`, a ne praćenje sistemske postavke: kartice,
# sloj sadržaja i naglasak su složeni za tamnu Micu, pa bi u svijetloj temi
# dio CSS-a iz stil.py izgubio kontrast.
#
# Sve što Streamlit ume obojiti sam stoji OVDJE; stil.py dodaje CSS samo za ono
# što tema ne pokriva (navigacija, kartice-postavke, tablica sljedivosti).

[theme]
base = "dark"

# Boje — Fluent tamni tokeni.
primaryColor = "#60cdff"              # zadani Windows naglasak (tamna tema)
backgroundColor = "#272727"           # sloj sadržaja
secondaryBackgroundColor = "#2d2d2d"  # polja, tablice (ControlFillColorDefault)
textColor = "#ffffff"
borderColor = "#3a3a3a"
linkColor = "#60cdff"
codeBackgroundColor = "#202020"
codeTextColor = "#ffffff"

# Semantičke boje (st.success/error, badge-evi) — Fluent „System*” boje.
greenColor = "#6ccb5f"
redColor = "#ff99a4"
orangeColor = "#fce100"
violetColor = "#c4b5fd"
blueColor = "#60cdff"
yellowColor = "#fce100"
grayColor = "#9a9a9a"

# Tipografija — Segoe UI Variable na Windowsu; na telefonu sistemski font
# (Roboto / San Francisco), što je i ono što bi Fluent tamo koristio.
font = "Segoe UI Variable Text, Segoe UI, system-ui, -apple-system, Roboto, sans-serif"
headingFont = "Segoe UI Variable Display, Segoe UI, system-ui, -apple-system, Roboto, sans-serif"
codeFont = "Cascadia Mono, Consolas, ui-monospace, monospace"
baseFontSize = 14

# Zaobljenja — ControlCornerRadius (4 px) i OverlayCornerRadius (8 px).
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = false

dataframeHeaderBackgroundColor = "#2b2b2b"
dataframeBorderColor = "#1d1d1d"

chartCategoricalColors = ["#60cdff", "#6ccb5f", "#fce100", "#ff99a4", "#c4b5fd", "#8cc4ff"]

[theme.sidebar]
# Navigacija leži na Mici, tamnijoj od sloja sadržaja — kao NavigationView.
backgroundColor = "#202020"
secondaryBackgroundColor = "#2d2d2d"
borderColor = "#202020"

[client]
# Sakrij „hamburger” izbornik razvijatelja radi čišćeg mobilnog prikaza.
toolbarMode = "minimal"
